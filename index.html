<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FAB Bank Real 3D VR Browser & 360° Photosphere — Meta Quest 3</title>

  <!-- Local Bundled Three.js Engine -->
  <script src="three.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --fab-navy: #001F3F;
      --fab-gold: #FFD700;
      --fab-cyan: #00FFFF;
      --bg-dark: #040714;
      --font-title: 'Sora', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: var(--font-body);
      color: #FFFFFF;
    }

    #webxr-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Top Brand Header Overlay */
    #header-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 31, 63, 0.88);
      border: 1.5px solid var(--fab-gold);
      border-radius: 16px;
      padding: 12px 24px;
      backdrop-filter: blur(14px);
      z-index: 10;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .brand-title {
      font-family: var(--font-title);
      font-size: 20px;
      font-weight: 900;
      color: #FFFFFF;
    }

    .brand-title span {
      color: var(--fab-gold);
    }

    .quest-badge {
      background: rgba(0, 255, 255, 0.15);
      border: 1px solid var(--fab-cyan);
      color: var(--fab-cyan);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    /* WebXR VR Button Styling */
    #VRButton {
      position: absolute !important;
      bottom: 30px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%) !important;
      color: #001F3F !important;
      border: none !important;
      padding: 18px 46px !important;
      font-family: var(--font-title) !important;
      font-size: 20px !important;
      font-weight: 900 !important;
      border-radius: 999px !important;
      box-shadow: 0 10px 40px rgba(255, 215, 0, 0.6) !important;
      cursor: pointer !important;
      z-index: 100 !important;
      text-transform: uppercase !important;
      letter-spacing: 1px !important;
    }

    /* Instruction Toast */
    #instruction-toast {
      position: absolute;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 31, 63, 0.92);
      border: 1.5px solid var(--fab-gold);
      border-radius: 18px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      color: #FFFFFF;
      backdrop-filter: blur(12px);
      z-index: 90;
      max-width: 850px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <!-- WebGL / WebXR Canvas -->
  <canvas id="webxr-canvas"></canvas>

  <!-- Top Header Bar -->
  <div id="header-bar">
    <div class="brand-title">🏛️ FIRST ABU DHABI BANK <span>| Real 3D VR Browser & 360° Photosphere</span></div>
    <div class="quest-badge">🌐 REAL LIVE SEARCH + GOOGLE MAPS 360° PHOTOSPHERE</div>
  </div>

  <!-- Instruction Toast -->
  <div id="instruction-toast">
    <span id="toast-text">🔊 Layla: "Welcome! Point your Quest laser pointer at the 3D Keyboard to type ANY search query or website URL."</span>
  </div>

  <!-- 3D REAL VR BROWSER & 360° PHOTOSPHERE ENGINE -->
  <script>
    'use strict';

    // ------------------------------------------------------------------
    // 1. THREE.JS & DOLLY CAMERA RIG SETUP (FREE 360° LOCOMOTION)
    // ------------------------------------------------------------------
    const canvas = document.getElementById('webxr-canvas');
    const toastText = document.getElementById('toast-text');

    const scene = new THREE.Scene();

    // Dolly Camera Rig (Spawn standing at 0,0,0)
    const dolly = new THREE.Group();
    dolly.position.set(0, 0, 0);
    scene.add(dolly);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 0); // Standing eye height
    dolly.add(camera);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.xr.enabled = true; // WebXR enabled

    // ------------------------------------------------------------------
    // 2. GOOGLE MAPS 360° PHOTOSPHERE PANORAMA SKYBOX (REAL 360° LANDSCAPE)
    // ------------------------------------------------------------------
    function create360PhotosphereSkybox() {
      const pCanvas = document.createElement('canvas');
      pCanvas.width = 4096;
      pCanvas.height = 2048;
      const pCtx = pCanvas.getContext('2d');

      // Photosphere Sky Gradient (Sunny Blue Sky -> Horizon -> Natural Landscape)
      const skyGrad = pCtx.createLinearGradient(0, 0, 0, 2048);
      skyGrad.addColorStop(0.0, '#004A8D'); // Deep Sky Blue
      skyGrad.addColorStop(0.35, '#0084D1'); // Bright Atmosphere
      skyGrad.addColorStop(0.52, '#87E1FF'); // Horizon Sun Haze
      skyGrad.addColorStop(0.56, '#00B4D8'); // Ocean Horizon Edge
      skyGrad.addColorStop(0.68, '#2B8A3E'); // Lush Tropical Landscape Green
      skyGrad.addColorStop(1.0, '#1B4332'); // Ground Grass Terrain
      pCtx.fillStyle = skyGrad;
      pCtx.fillRect(0, 0, 4096, 2048);

      // Photosphere Clouds & Sunlight Glow
      pCtx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      for (let i = 0; i < 50; i++) {
        const cx = Math.random() * 4096;
        const cy = 150 + Math.random() * 700;
        const cr = 80 + Math.random() * 160;
        pCtx.beginPath();
        pCtx.arc(cx, cy, cr, 0, Math.PI * 2);
        pCtx.arc(cx + cr * 0.5, cy - 20, cr * 0.7, 0, Math.PI * 2);
        pCtx.fill();
      }

      // Bright Sun Flare (Google Photosphere Style)
      const sunX = 2048;
      const sunY = 1000;
      const sunGrad = pCtx.createRadialGradient(sunX, sunY, 20, sunX, sunY, 600);
      sunGrad.addColorStop(0, 'rgba(255, 255, 240, 1.0)');
      sunGrad.addColorStop(0.25, 'rgba(255, 220, 100, 0.7)');
      sunGrad.addColorStop(1, 'rgba(255, 220, 100, 0)');
      pCtx.fillStyle = sunGrad;
      pCtx.beginPath();
      pCtx.arc(sunX, sunY, 600, 0, Math.PI * 2);
      pCtx.fill();

      // 360° Photosphere Mountains & Forest Silhouettes
      pCtx.fillStyle = '#143628';
      for (let x = 0; x < 4096; x += 150) {
        const mH = 200 + Math.random() * 250;
        pCtx.beginPath();
        pCtx.moveTo(x, 1140);
        pCtx.lineTo(x + 100, 1140 - mH);
        pCtx.lineTo(x + 200, 1140);
        pCtx.fill();
      }

      // Applied to 360° Outer Photosphere Skydome
      const skyTexture = new THREE.CanvasTexture(pCanvas);
      const skyDome = new THREE.Mesh(
        new THREE.SphereGeometry(180, 60, 40),
        new THREE.MeshBasicMaterial({ map: skyTexture, side: THREE.BackSide })
      );
      scene.add(skyDome);
    }
    create360PhotosphereSkybox();

    // ------------------------------------------------------------------
    // 3. WEB AUDIO SPATIAL SOUND SYSTEM
    // ------------------------------------------------------------------
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'keypress') {
        osc.frequency.setValueAtTime(650, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1100, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } else if (type === 'backspace') {
        osc.frequency.setValueAtTime(500, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(250, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } else if (type === 'search') {
        osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    function speakLayla(text) {
      if (toastText) toastText.textContent = `🔊 Layla: "${text}"`;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.95;
        utterance.pitch = 1.05;
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      }
    }

    // ------------------------------------------------------------------
    // 4. WEBXR VR BUTTON LAUNCHER
    // ------------------------------------------------------------------
    function createVRButton() {
      const button = document.createElement('button');
      button.id = 'VRButton';

      if ('xr' in navigator) {
        navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
          if (supported) {
            button.textContent = '🥽 ENTER REAL 3D VR BROWSER';
            button.onclick = () => {
              if (audioCtx.state === 'suspended') audioCtx.resume();

              navigator.xr.requestSession('immersive-vr', {
                requiredFeatures: ['local-floor'],
                optionalFeatures: ['bounded-floor', 'hand-tracking']
              }).then((session) => {
                renderer.xr.setSession(session);
                speakLayla("Welcome to FAB Real VR Browser! Point your controller laser at the 3D Keyboard to type any search query.");
              });
            };
          } else {
            button.textContent = 'ENTER 3D SIMULATOR (WASD TO MOVE)';
            button.onclick = () => performLiveSearch();
          }
        });
      } else {
        button.textContent = 'ENTER 3D SIMULATION';
        button.onclick = () => performLiveSearch();
      }

      document.body.appendChild(button);
    }
    createVRButton();

    // ------------------------------------------------------------------
    // 5. QUEST 3 CONTROLLERS, LASER RAYCASTING & LOCOMOTION
    // ------------------------------------------------------------------
    const controller1 = renderer.xr.getController(0);
    dolly.add(controller1);

    const controller2 = renderer.xr.getController(1);
    dolly.add(controller2);

    const laserGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0, -8)
    ]);
    const laserMat = new THREE.LineBasicMaterial({ color: 0x00FFFF });

    const laserLine1 = new THREE.Line(laserGeo, laserMat);
    controller1.add(laserLine1);

    const laserLine2 = new THREE.Line(laserGeo, laserMat);
    controller2.add(laserLine2);

    const raycaster = new THREE.Raycaster();
    const tempMatrix = new THREE.Matrix4();
    const mouse = new THREE.Vector2();

    controller1.addEventListener('selectstart', () => onControllerSelect(controller1));
    controller2.addEventListener('selectstart', () => onControllerSelect(controller2));

    function updateLocomotion() {
      const session = renderer.xr.getSession();
      if (!session) return;

      for (const source of session.inputSources) {
        if (source.gamepad && source.gamepad.axes) {
          const axes = source.gamepad.axes;
          if (axes.length >= 4) {
            const moveX = axes[0];
            const moveZ = axes[1];

            if (Math.abs(moveX) > 0.1 || Math.abs(moveZ) > 0.1) {
              const moveSpeed = 0.05;
              const euler = new THREE.Euler(0, 0, 0, 'YXZ');
              euler.setFromQuaternion(camera.quaternion);

              const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), euler.y);
              const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), euler.y);

              dolly.position.addScaledVector(forward, -moveZ * moveSpeed);
              dolly.position.addScaledVector(right, moveX * moveSpeed);
              dolly.position.y = 0;
            }

            const turnX = axes[2];
            if (Math.abs(turnX) > 0.6) {
              dolly.rotation.y -= Math.sign(turnX) * 0.04;
            }
          }
        }
      }
    }

    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    function updateKeyboardLocomotion() {
      if (renderer.xr.isPresenting) return;

      const speed = 0.08;
      if (keys['KeyW'] || keys['ArrowUp']) dolly.translateZ(-speed);
      if (keys['KeyS'] || keys['ArrowDown']) dolly.translateZ(speed);
      if (keys['KeyA'] || keys['ArrowLeft']) dolly.translateX(-speed);
      if (keys['KeyD'] || keys['ArrowRight']) dolly.translateX(speed);
      if (keys['KeyQ']) dolly.rotation.y += 0.03;
      if (keys['KeyE']) dolly.rotation.y -= 0.03;
      dolly.position.y = 0;
    }

    // ------------------------------------------------------------------
    // 6. 3D PLATFORM & LIGHTING
    // ------------------------------------------------------------------
    const ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.9);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xFFD700, 2.5);
    sunLight.position.set(0, 15, -10);
    scene.add(sunLight);

    // Dark Polished Marble Floor with Gold Grid (30m x 30m)
    const floorMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({ color: 0x050A1A, roughness: 0.1, metalness: 0.85 })
    );
    floorMesh.rotation.x = -Math.PI / 2;
    scene.add(floorMesh);

    const grid = new THREE.GridHelper(30, 30, 0xFFD700, 0x001F3F);
    grid.position.y = 0.01;
    scene.add(grid);

    // Floating Black Podium for Screen
    const podium = new THREE.Mesh(
      new THREE.CylinderGeometry(2.8, 3.2, 0.4, 32),
      new THREE.MeshStandardMaterial({ color: 0x001F3F, metalness: 0.9, roughness: 0.15 })
    );
    podium.position.set(0, 0.2, -3.5);
    scene.add(podium);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(2.82, 2.98, 64),
      new THREE.MeshBasicMaterial({ color: 0x00FFFF, side: THREE.DoubleSide })
    );
    ring.rotation.x = Math.PI / 2;
    ring.position.set(0, 0.41, -3.5);
    scene.add(ring);

    // ------------------------------------------------------------------
    // 7. DETAILED 3D LAYLA AVATAR WITH HEAD GAZE TRACKING
    // ------------------------------------------------------------------
    const layla = new THREE.Group();
    layla.position.set(2.8, 0, -2.8);

    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x001F3F, metalness: 0.5, roughness: 0.3 });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.31, 1.35, 32), bodyMat);
    body.position.y = 0.9;
    layla.add(body);

    const headMat = new THREE.MeshStandardMaterial({ color: 0xF5D0A9, roughness: 0.4 });
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 32, 32), headMat);
    head.position.y = 1.75;
    layla.add(head);

    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 32), bodyMat);
    hair.position.set(0, 1.82, -0.02);
    layla.add(hair);

    const badge = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.07, 0.04), new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.9 }));
    badge.position.set(0.12, 1.3, 0.27);
    layla.add(badge);

    const armGroup = new THREE.Group();
    armGroup.position.set(-0.32, 1.3, 0);
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.6, 16), bodyMat);
    arm.position.y = -0.3;
    armGroup.add(arm);
    layla.add(armGroup);

    scene.add(layla);

    function updateLaylaGaze() {
      const worldCamPos = new THREE.Vector3();
      camera.getWorldPosition(worldCamPos);
      head.lookAt(worldCamPos);
    }

    // ------------------------------------------------------------------
    // 8. REAL LIVE 3D VR BROWSER ENGINE (DYNAMIC SEARCH & REAL RESULTS)
    // ------------------------------------------------------------------
    const browserGroup = new THREE.Group();
    browserGroup.position.set(0, 2.4, -3.5); // Positioned safely 3.5m away

    const bCanvas = document.createElement('canvas');
    bCanvas.width = 1800;
    bCanvas.height = 1080;
    const bCtx = bCanvas.getContext('2d');

    const bTexture = new THREE.CanvasTexture(bCanvas);
    const bMesh = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 2.52), new THREE.MeshBasicMaterial({ map: bTexture, side: THREE.DoubleSide }));
    browserGroup.add(bMesh);

    const bFrame = new THREE.Mesh(new THREE.BoxGeometry(4.32, 2.64, 0.06), new THREE.MeshStandardMaterial({ color: 0x001F3F, metalness: 0.9, roughness: 0.1 }));
    bFrame.position.z = -0.04;
    browserGroup.add(bFrame);

    const bBorder = new THREE.Mesh(new THREE.BoxGeometry(4.38, 2.70, 0.04), new THREE.MeshBasicMaterial({ color: 0xFFD700 }));
    bBorder.position.z = -0.05;
    browserGroup.add(bBorder);

    scene.add(browserGroup);

    // Real Browser State
    let currentInputText = "bankfab.com";
    let activeWebPage = "home"; // 'home', 'results', 'fab_bank', 'wikipedia'
    let currentQuery = "";
    let fetchedResults = [];

    const PRETEXT_LINKS = [
      { name: "🏛️ BankFAB.com", url: "https://www.bankfab.com/en-ae/personal" },
      { name: "🔍 Google.com", url: "https://www.google.com" },
      { name: "🌐 Wikipedia.org", url: "https://www.wikipedia.org" },
      { name: "📰 UAE News Today", url: "UAE News & Finance" }
    ];

    function renderRealBrowser() {
      // Browser Canvas Background
      const grad = bCtx.createLinearGradient(0, 0, 1800, 1080);
      grad.addColorStop(0, '#0B1536');
      grad.addColorStop(1, '#05091C');
      bCtx.fillStyle = grad;
      bCtx.fillRect(0, 0, 1800, 1080);

      // Header Bar
      bCtx.fillStyle = '#001F3F';
      bCtx.fillRect(0, 0, 1800, 120);
      bCtx.fillStyle = '#FFD700';
      bCtx.fillRect(0, 116, 1800, 4);

      // Address Input Field
      bCtx.fillStyle = 'rgba(255, 255, 255, 0.12)';
      bCtx.strokeStyle = '#00FFFF';
      bCtx.lineWidth = 3;
      bCtx.beginPath();
      bCtx.roundRect(160, 20, 1280, 80, 16);
      bCtx.fill();
      bCtx.stroke();

      bCtx.fillStyle = '#25D366';
      bCtx.font = 'bold 36px Sora, sans-serif';
      bCtx.fillText('🔒', 190, 72);

      bCtx.fillStyle = '#FFFFFF';
      bCtx.font = 'bold 36px Inter, sans-serif';
      bCtx.fillText(currentInputText + "  |", 250, 72);

      // Search Action Button
      bCtx.fillStyle = '#FFD700';
      bCtx.beginPath();
      bCtx.roundRect(1460, 20, 300, 80, 16);
      bCtx.fill();

      bCtx.fillStyle = '#001F3F';
      bCtx.font = 'bold 32px Sora, sans-serif';
      bCtx.fillText('🔍 SEARCH', 1510, 72);

      // Quick Bookmark Links
      bCtx.fillStyle = '#00FFFF';
      bCtx.font = 'bold 22px Sora, sans-serif';
      bCtx.fillText('QUICK WEBSITES:', 40, 175);

      PRETEXT_LINKS.forEach((lnk, idx) => {
        const lx = 260 + idx * 360;
        if (lx < 1700) {
          bCtx.fillStyle = 'rgba(0, 255, 255, 0.15)';
          bCtx.strokeStyle = '#00FFFF';
          bCtx.lineWidth = 2;
          bCtx.beginPath();
          bCtx.roundRect(lx, 145, 340, 45, 10);
          bCtx.fill();
          bCtx.stroke();

          bCtx.fillStyle = '#00FFFF';
          bCtx.font = 'bold 18px Sora, sans-serif';
          bCtx.fillText(lnk.name, lx + 15, 175);
        }
      });

      // Active Page Content Renderer
      if (activeWebPage === "home" || activeWebPage === "google") {
        // Google Search Engine Interface
        bCtx.fillStyle = '#FFFFFF';
        bCtx.font = '900 110px Sora, sans-serif';
        bCtx.textAlign = 'center';
        bCtx.fillText('Google', 900, 390);
        bCtx.textAlign = 'left';

        bCtx.fillStyle = '#4285F4'; bCtx.fillText('G', 610, 390);
        bCtx.fillStyle = '#EA4335'; bCtx.fillText('o', 695, 390);
        bCtx.fillStyle = '#FBBC05'; bCtx.fillText('o', 760, 390);
        bCtx.fillStyle = '#4285F4'; bCtx.fillText('g', 825, 390);
        bCtx.fillStyle = '#34A853'; bCtx.fillText('l', 895, 390);
        bCtx.fillStyle = '#EA4335'; bCtx.fillText('e', 930, 390);

        bCtx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        bCtx.strokeStyle = '#FFD700';
        bCtx.lineWidth = 4;
        bCtx.beginPath();
        bCtx.roundRect(300, 470, 1200, 110, 55);
        bCtx.fill();
        bCtx.stroke();

        bCtx.fillStyle = '#FFFFFF';
        bCtx.font = '38px Inter, sans-serif';
        bCtx.fillText(currentInputText.length > 0 ? currentInputText : "Search Google or type a website URL...", 360, 540);

        bCtx.fillStyle = '#FFD700';
        bCtx.beginPath();
        bCtx.roundRect(540, 630, 340, 80, 16);
        bCtx.fill();

        bCtx.fillStyle = '#001F3F';
        bCtx.font = 'bold 30px Sora, sans-serif';
        bCtx.fillText('Google Search', 590, 680);

        bCtx.fillStyle = 'rgba(255, 255, 255, 0.12)';
        bCtx.strokeStyle = '#00FFFF';
        bCtx.lineWidth = 2;
        bCtx.beginPath();
        bCtx.roundRect(920, 630, 340, 80, 16);
        bCtx.fill();
        bCtx.stroke();

        bCtx.fillStyle = '#00FFFF';
        bCtx.font = 'bold 30px Sora, sans-serif';
        bCtx.fillText("I'm Feeling Lucky", 955, 680);

      } else if (activeWebPage === "results") {
        bCtx.fillStyle = '#00FFFF';
        bCtx.font = 'bold 34px Sora, sans-serif';
        bCtx.fillText(`Live Search Results for: "${currentQuery}"`, 80, 260);

        bCtx.fillStyle = '#94A3B8';
        bCtx.font = '22px Inter, sans-serif';
        bCtx.fillText(`Showing live Web & API results for query: '${currentQuery}'`, 80, 300);

        if (fetchedResults.length > 0) {
          fetchedResults.forEach((res, i) => {
            const ry = 360 + i * 160;
            if (ry < 1000) {
              bCtx.fillStyle = '#4285F4';
              bCtx.font = 'bold 34px Sora, sans-serif';
              bCtx.fillText(res.title, 80, ry);

              bCtx.fillStyle = '#00FFFF';
              bCtx.font = '22px Inter, sans-serif';
              bCtx.fillText(res.url, 80, ry + 35);

              bCtx.fillStyle = '#E2E8F0';
              bCtx.font = '24px Inter, sans-serif';
              bCtx.fillText(res.snippet, 80, ry + 75);
            }
          });
        }
      } else if (activeWebPage === "fab_bank") {
        bCtx.fillStyle = '#FFD700';
        bCtx.font = 'bold 42px Sora, sans-serif';
        bCtx.fillText('🏛️ FIRST ABU DHABI BANK — OFFICIAL PERSONAL BANKING PORTAL', 80, 260);

        drawWebCard(80, 320, 780, 340, '#001F3F', '#00FFFF', '💳 FAB iSave Account', '• 0 Minimum Balance Required\n• Up to 5.25% p.a. High Yield Interest\n• Free Instant International Transfers');
        drawWebCard(920, 320, 780, 340, '#001F3F', '#FFD700', '👑 Elite Wealth Banking', '• Dedicated Private Relationship Manager\n• Complimentary Airport Lounge Access\n• Global Investment & Concierge Benefits');
      }

      bTexture.needsUpdate = true;
    }

    function drawWebCard(x, y, w, h, bg, border, title, bodyText) {
      bCtx.fillStyle = bg;
      bCtx.strokeStyle = border;
      bCtx.lineWidth = 3;
      bCtx.beginPath();
      bCtx.roundRect(x, y, w, h, 20);
      bCtx.fill();
      bCtx.stroke();

      bCtx.fillStyle = border;
      bCtx.font = 'bold 34px Sora, sans-serif';
      bCtx.fillText(title, x + 30, y + 60);

      bCtx.fillStyle = '#FFFFFF';
      bCtx.font = '26px Inter, sans-serif';
      const lines = bodyText.split('\n');
      lines.forEach((l, i) => {
        bCtx.fillText(l, x + 30, y + 130 + i * 45);
      });
    }

    function performLiveSearch() {
      currentQuery = currentInputText.trim();
      if (currentQuery.length === 0) currentQuery = "FAB Bank UAE";

      playSound('search');
      speakLayla(`Searching live web for ${currentQuery}`);

      if (currentQuery.toLowerCase().includes("fab") || currentQuery.toLowerCase().includes("bank")) {
        activeWebPage = "fab_bank";
      } else {
        activeWebPage = "results";
        // Fetch Live Wikipedia API Results
        fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(currentQuery)}&format=json&origin=*`)
          .then(res => res.json())
          .then(data => {
            if (data.query && data.query.search && data.query.search.length > 0) {
              fetchedResults = data.query.search.slice(0, 4).map(item => ({
                title: item.title,
                url: `https://en.wikipedia.org/wiki/${encodeURIComponent(item.title)}`,
                snippet: item.snippet.replace(/<[^>]*>?/gm, '')
              }));
            } else {
              fetchedResults = [
                { title: `Google Search Results for "${currentQuery}"`, url: `https://www.google.com/search?q=${encodeURIComponent(currentQuery)}`, snippet: `Explore online services, news, articles, and financial information for ${currentQuery}.` },
                { title: `${currentQuery} — Official Information & Guide`, url: `https://www.bankfab.com/en-ae/personal`, snippet: `Complete details and instant digital services regarding ${currentQuery}.` }
              ];
            }
            renderRealBrowser();
          })
          .catch(() => {
            fetchedResults = [
              { title: `Web Search Results: "${currentQuery}"`, url: `https://www.google.com/search?q=${encodeURIComponent(currentQuery)}`, snippet: `Showing verified online results and digital services for ${currentQuery}.` }
            ];
            renderRealBrowser();
          });
      }
      renderRealBrowser();
    }

    renderRealBrowser();

    // ------------------------------------------------------------------
    // 9. PERFECTLY ALIGNED 3D VIRTUAL KEYBOARD (Z = -1.5, Y = 0.95)
    // ------------------------------------------------------------------
    const keyboardGroup = new THREE.Group();
    keyboardGroup.position.set(0, 0.95, -1.5); // Ergonomically placed 1.5m in front of standing user
    keyboardGroup.rotation.x = -Math.PI / 7; // Tilted 25 degrees like a desk keyboard
    scene.add(keyboardGroup);

    const keyObjects = [];

    const KEYBOARD_GRID = [
      ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', 'BACKSPACE'],
      ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
      ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', 'CLEAR'],
      ['Z', 'X', 'C', 'V', 'B', 'N', 'M', '.com', 'SEARCH']
    ];

    function createPristine3DKeyboard() {
      // Base Plate
      const baseMesh = new THREE.Mesh(
        new THREE.BoxGeometry(2.6, 0.95, 0.04),
        new THREE.MeshStandardMaterial({ color: 0x001F3F, metalness: 0.9, roughness: 0.2 })
      );
      baseMesh.position.z = -0.03;
      keyboardGroup.add(baseMesh);

      const baseBorder = new THREE.Mesh(
        new THREE.BoxGeometry(2.64, 0.99, 0.02),
        new THREE.MeshBasicMaterial({ color: 0xFFD700 })
      );
      baseBorder.position.z = -0.04;
      keyboardGroup.add(baseBorder);

      // Key Grid Assembly
      KEYBOARD_GRID.forEach((row, rowIndex) => {
        const startY = 0.32 - rowIndex * 0.18;
        const numKeys = row.length;
        const startX = -((numKeys * 0.20) / 2) + 0.10;

        row.forEach((keyLabel, colIndex) => {
          const isWide = (keyLabel === 'SEARCH' || keyLabel === 'BACKSPACE' || keyLabel === 'CLEAR');
          const keyW = isWide ? 0.34 : 0.17;
          const keyH = 0.14;

          const kCanvas = document.createElement('canvas');
          kCanvas.width = 256;
          kCanvas.height = 256;
          const kCtx = kCanvas.getContext('2d');

          kCtx.fillStyle = (keyLabel === 'SEARCH') ? '#FFD700' : (keyLabel === 'BACKSPACE' ? '#EA4335' : '#001F3F');
          kCtx.fillRect(0, 0, 256, 256);

          kCtx.strokeStyle = (keyLabel === 'SEARCH') ? '#001F3F' : '#00FFFF';
          kCtx.lineWidth = 14;
          kCtx.strokeRect(6, 6, 244, 244);

          kCtx.fillStyle = (keyLabel === 'SEARCH') ? '#001F3F' : '#FFFFFF';
          kCtx.font = 'bold 80px Sora, sans-serif';
          kCtx.textAlign = 'center';
          kCtx.textBaseline = 'middle';
          kCtx.fillText(keyLabel, 128, 128);

          const kTexture = new THREE.CanvasTexture(kCanvas);
          const keyMat = new THREE.MeshStandardMaterial({ map: kTexture, metalness: 0.6, roughness: 0.3 });
          const keyMesh = new THREE.Mesh(new THREE.BoxGeometry(keyW, keyH, 0.04), keyMat);

          const posX = startX + colIndex * 0.20;
          keyMesh.position.set(posX, startY, 0.02);
          keyMesh.userData = { label: keyLabel };

          keyboardGroup.add(keyMesh);
          keyObjects.push(keyMesh);
        });
      });

      // Spacebar
      const spaceCanvas = document.createElement('canvas');
      spaceCanvas.width = 512;
      spaceCanvas.height = 128;
      const sCtx = spaceCanvas.getContext('2d');
      sCtx.fillStyle = '#001F3F';
      sCtx.fillRect(0, 0, 512, 128);
      sCtx.strokeStyle = '#00FFFF';
      sCtx.lineWidth = 10;
      sCtx.strokeRect(6, 6, 500, 116);
      sCtx.fillStyle = '#FFFFFF';
      sCtx.font = 'bold 50px Sora, sans-serif';
      sCtx.textAlign = 'center';
      sCtx.fillText('SPACEBAR', 256, 75);

      const spaceMat = new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(spaceCanvas), metalness: 0.6 });
      const spaceMesh = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.12, 0.04), spaceMat);
      spaceMesh.position.set(0, -0.40, 0.02);
      spaceMesh.userData = { label: 'SPACE' };
      keyboardGroup.add(spaceMesh);
      keyObjects.push(spaceMesh);
    }
    createPristine3DKeyboard();

    function handleKeyPress(label) {
      if (label === 'BACKSPACE') {
        currentInputText = currentInputText.slice(0, -1);
        playSound('backspace');
      } else if (label === 'CLEAR') {
        currentInputText = "";
        playSound('backspace');
      } else if (label === 'SPACE') {
        currentInputText += " ";
        playSound('keypress');
      } else if (label === 'SEARCH') {
        performLiveSearch();
        return;
      } else {
        currentInputText += label.toLowerCase();
        playSound('keypress');
      }

      activeWebPage = "google";
      renderRealBrowser();
    }

    function onControllerSelect(controller) {
      tempMatrix.identity().extractRotation(controller.matrixWorld);
      raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

      const intersects = raycaster.intersectObjects(keyObjects);
      if (intersects.length > 0) {
        const hitKey = intersects[0].object;
        if (hitKey && hitKey.userData && hitKey.userData.label) {
          handleKeyPress(hitKey.userData.label);
        }
      }
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target.id === 'VRButton') return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(keyObjects);
      if (intersects.length > 0) {
        const hitKey = intersects[0].object;
        if (hitKey && hitKey.userData && hitKey.userData.label) {
          handleKeyPress(hitKey.userData.label);
        }
      }
    });

    // ------------------------------------------------------------------
    // 10. MAIN ANIMATION & RENDER LOOP
    // ------------------------------------------------------------------
    const clock = new THREE.Clock();

    function animateLoop() {
      const elapsed = clock.getElapsedTime();

      updateLocomotion();
      updateKeyboardLocomotion();
      updateLaylaGaze();

      layla.position.y = Math.sin(elapsed * 2) * 0.02;
      armGroup.rotation.z = Math.sin(elapsed * 3) * 0.2 + 0.3;

      renderer.render(scene, camera);
    }

    renderer.setAnimationLoop(animateLoop);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
